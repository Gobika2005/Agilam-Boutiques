<!doctype html>
<!-- en-IN, not en: the catalogue is priced in rupees, sized to Indian
     measurements and delivered in India. It tells a search engine which market
     this belongs to. The edge middleware rewrites this per request too. -->
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF6F2" />
<!--
  The title and description here are the fallback only. Every real page gets its
  own, written server-side by `middleware.ts` before the HTML is sent (which is
  what non-JavaScript crawlers and link-preview bots read) and kept in step
  during client-side navigation by `usePageMeta`.
-->
<title>MangaiMart</title>
<meta name="description" content="Shop verified Tamil Nadu boutiques in one place — sarees, kurta sets, kurtis and more, with direct chat to the shop." />
<meta name="author" content="MangaiMart" />
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
<!-- Local signals: this is a Tamil Nadu marketplace, and "boutiques in
     Coimbatore" is a query it should be able to win. -->
<meta name="geo.region" content="IN-TN" />
<meta name="geo.placename" content="Tamil Nadu, India" />
<!-- 500×500 / 110 kB, not the 1107×1107 / 983 kB `favicon.png` this used to
     point at (while declaring "512x512", which was wrong as well). A favicon is
     requested on every cold load and shares the connection with the JavaScript
     bundle and the LCP image, so ~1 MB of it was bandwidth taken directly from
     the things the page is waiting on. `favicon.png` is left in place — older
     bookmarks and cached manifests still reference it. -->
<link rel="icon" type="image/png" sizes="500x500" href="/icon-500.png" />
<link rel="apple-touch-icon" href="/icon-500.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<!-- Resolve the theme before first paint so there's never a wrong-theme flash.
     A saved choice wins; otherwise follow the device's prefers-color-scheme. -->
<script>try{var p=localStorage.getItem('ag-theme-pref');var t=(p==='light'||p==='dark')?p:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(t==='dark'){document.documentElement.dataset.theme='dark';document.querySelector('meta[name=theme-color]').setAttribute('content','#120A0E');}}catch(e){}</script>
<!-- ── Fonts ────────────────────────────────────────────────────────────────
     A `<link rel="stylesheet">` in the head is render-blocking: the browser
     will not paint until it has fetched the CSS *and* the font files it names.
     On the 3G connections most of this marketplace's shoppers are on, these
     three stylesheets were adding roughly 400–900 ms to first paint, in front
     of a splash screen that exists precisely to avoid making people wait.

     They are now loaded asynchronously with the `media="print"` swap: the
     browser fetches them at low priority without blocking the render, and the
     `onload` promotes them to `all` the instant they arrive. `<noscript>` keeps
     the plain blocking version for anything that can't run the swap.

     Playfair's italic 500 and 600 are dropped — the design only ever sets
     italic on already-bold display type, so they were two fetched weights that
     nothing used. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  media="print"
  onload="this.media='all';this.onload=null"
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
/>
<!-- Icon font stays on `display=block`: with `swap` the browser would paint the
     ligature source text first, so every icon would flash the literal word
     "storefront" or "shopping_bag" before resolving. -->
<link
  rel="stylesheet"
  media="print"
  onload="this.media='all';this.onload=null"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
/>
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet" />
</noscript>
<!-- ── First paint ──────────────────────────────────────────────────────────
     Everything below renders from HTML alone, before a single byte of the app
     bundle has run. It exists because on a 3G connection — the normal case for
     this marketplace's audience — the page was a blank white screen for 7.4
     seconds and unusable for 14.8, with no logo and no motion to say the site
     was alive. Now the brand and a spinner land as soon as the HTML does.
     Styles are inline and the wordmark is TEXT, not an image: the 93 kB PNG
     logo cost ~2 s of the very wait this is meant to cover, so the splash now
     needs exactly zero network requests and paints with the HTML. It removes
     itself the moment React paints, via #root:not(:empty) — no JS, no timer,
     no flash. -->
<style>
  #ag-boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:#FBF6F2;
    transition:opacity .35s ease}
  html[data-theme="dark"] #ag-boot{background:#120A0E}
  /* Georgia paints instantly; Playfair swaps in when the webfont lands. */
  #ag-boot .ag-boot-mark{font-family:'Playfair Display',Georgia,'Times New Roman',serif;
    font-size:38px;font-weight:700;letter-spacing:-.5px;color:#B02454;line-height:1}
  html[data-theme="dark"] #ag-boot .ag-boot-mark{color:#E85088}
  #ag-boot .ag-boot-tag{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:10px;letter-spacing:.22em;font-weight:700;
    color:#775D66;text-transform:uppercase}
  html[data-theme="dark"] #ag-boot .ag-boot-tag{color:#A98D99}
  #ag-boot .ag-boot-ring{width:26px;height:26px;border-radius:50%;
    border:2.5px solid #F0D8E2;border-top-color:#B02454;
    animation:ag-boot-spin .8s linear infinite}
  html[data-theme="dark"] #ag-boot .ag-boot-ring{border-color:#3A2730;border-top-color:#E85088}
  @keyframes ag-boot-spin{to{transform:rotate(360deg)}}
  /* The app has mounted — retire the splash. */
  #root:not(:empty)+#ag-boot{opacity:0;pointer-events:none;visibility:hidden}
  @media (prefers-reduced-motion:reduce){
    #ag-boot .ag-boot-ring{animation-duration:2s}
    #ag-boot{transition:none}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="ag-boot" role="status" aria-live="polite">
  <span class="ag-boot-mark">MangaiMart</span>
  <span class="ag-boot-tag">All boutiques · one place</span>
  <span class="ag-boot-ring" aria-hidden="true"></span>
  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading MangaiMart…</span>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>

<title>Agilam Boutiques</title>
<!-- Apply the saved theme before first paint so returning dark users never see
     a light flash. Default is light; the OS preference is intentionally ignored. -->
<script>try{if(localStorage.getItem('ag-theme')==='dark'){document.documentElement.dataset.theme='dark';document.querySelector('meta[name=theme-color]').setAttribute('content','#120A0E');}}catch(e){}</script>
